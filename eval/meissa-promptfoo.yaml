# eval/meissa-promptfoo.yaml
# Meissa TAYF sınıflandırıcı — otomatik isabet testi
# Kaynak: TAYF/ELLE_KONTROL_50.md (43 ✅ satır, 7 ❌ bilinen sınırlama)
#
# Çalıştırmak için:
#   npx promptfoo@latest eval -c eval/meissa-promptfoo.yaml
#
# NOT: Level2 (LLM) kararları Ollama çalışıyorsa tam değerlendirme yapar.
#      Ollama kapalıysa level0 eşleşmeleri (yaklaşık %40) hâlâ çalışır,
#      geri kalanlar FALLBACK (sohbet/sohbet) döner — rota=sohbet assertleri geçer,
#      resim/ses assertleri başarısız olur.

description: "Meissa TAYF Sınıflandırıcı — Elle Kontrol 50 İsabet Testi"

providers:
  - file://../scripts/meissa-promptfoo-provider.js

prompts:
  - "{{message}}"

defaultTest:
  assert:
    - type: javascript
      value: |
        // output geçerli JSON olmalı
        try { JSON.parse(output); return true; } catch { return false; }

tests:

  # ─── ANALİZ / sohbet (satır 1-3) ──────────────────────────────────────────

  - description: "#1 — analiz/sohbet: bug nerede olabilir"
    vars:
      message: "bug nerede olabilir"
    assert:
      - type: javascript
        value: "JSON.parse(output).rota === 'sohbet'"
      - type: javascript
        value: "JSON.parse(output).kategoriler.includes('analiz')"

  - description: "#2 — analiz/sohbet: memory leak tespiti"
